[project]
name = "server-monitor"
version = "0.1.0"
description = "Monitor de recursos del servidor en terminal (CPU, RAM, temp, red, servicios)"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.60.0",
    "psutil>=5.9.0",
]

[project.scripts]
server-monitor = "monitor.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["monitor"]
